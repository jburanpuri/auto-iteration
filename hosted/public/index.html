<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · Reviews</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><a class="brand" href="./"><span>✳</span> northstar</a><a class="workspace" id="product-link" href="/product/">Open Northstar ↗</a></header>
<main>
  <section class="heading"><div><p class="eyebrow">LISTEN. UNDERSTAND. IMPROVE.</p><h1>Reviews</h1><p class="subtitle">What people are saying about Northstar.</p></div><button id="start" disabled>Summarize & start workflow <span>↗</span></button></section>
  <section id="summary" hidden><div class="summary-heading"><div><p class="eyebrow">THE COMMON THEMES</p><h2>Issue summary</h2></div><span id="summary-status" class="muted"></span></div><div id="issues" class="issues"></div></section>
  <div class="list-heading"><h2>All feedback <span id="count">120</span></h2><span class="sample-label">120 SAMPLE REVIEWS + SUBMISSIONS</span></div>
  <div id="reviews" class="reviews" aria-live="polite"><p class="muted">Loading feedback…</p></div>
  <button id="more" class="more" hidden>Show more reviews</button>
  <p id="notice" class="notice" role="status"></p>

  <footer><span>© 2026 Northstar</span><span>Every piece of feedback helps.</span></footer>
</main><script type="module" src="./app.mjs"></script>
</body></html>
